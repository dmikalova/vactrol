# Typos configuration
# https://github.com/crate-ci/typos

[default.extend-words]
# "mis-scripted" (as in a deliberately wrong test script) is intentional.
mis = "mis"
caf = "caf"
# Card names
Theyre = "Theyre" # They're Everywhere
theyre = "theyre"
Frane = "Frane" # First Officer Frane
# Identity mapping: leave the possessive-stripped token "Franes" alone. It must
# NOT map to a different value (e.g. "Franes'") — an active correction would
# rewrite the identifiers in cardlookup's name tests on every commit.
Franes = "Franes"

[files]
extend-exclude = [
  # Card-database provenance holds official card names (proper nouns like
  # "Bosun Creen", "Narl Gibbus", "Frane") that must not be "corrected".
  "internal/cards/provenance/**",
  # Binary assets and generated binaries typos should not scan.
  "docs/keyforge-master-rulebook-images/**",
  "gencomments",
  "genprovenance",
]
