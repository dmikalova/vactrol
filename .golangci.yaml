version: "2"

run:
  build-tags:
    - ruleguard

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - gocognit
    - gocritic
    - misspell
    - revive
    - unconvert

  settings:
    # gocognit measures cognitive (not cyclomatic) complexity: the engine's flat
    # Visitor dispatch switches (ADR 0006) stay cheap while genuinely nested logic
    # is flagged. 30 holds the engine's genuinely nested seams split (fight,
    # NewCard, hasKeyword, the text renderers, Target.filter, triggeredBy,
    # RenderAbility, allowedHouses — see docs/todo-agent.md); the one exclusion
    # below is the effect glyph family, deferred to its own pass. Treat
    # this as a smoke detector: split a function when a reader gains from it, exempt
    # an honest one cohesive dispatch.
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: "ruleguard.go"

  exclusions:
    rules:
      # Invalid-zero enum sentinels (…Unset) are intentionally unreferenced: the
      # zero value must be a named-but-unused placeholder so an omitted enum field
      # is caught rather than silently defaulting. This matches only those consts
      # by name, leaving `unused` fully active for everything else.
      - linters:
          - unused
        text: "const \\w+Unset is unused"

      # The engine and card facade deliberately use rulebook-first / imperative doc
      # comments (e.g. "// stun a creature ...", "// A Before Fight ability
      # resolves ...") and section-grouped type aliases, rather than the Go-doc
      # "Name ..." form — they feed the rulebook term registry (engine.RuleTerms())
      # and read like the printed cards. Drop revive's comment-form check; the
      # presence check ("should have comment") stays active.
      - linters:
          - revive
        text: "should be of the form"

      # Set packages carry no package doc comment by design — each holds only
      # self-registering card vars.
      - linters:
          - revive
        path: internal/cards/sets/
        text: "should have a package comment"

      # Table-driven tests accrue high cognitive complexity from their case lists,
      # not tangled logic, so exempt test files from the gocognit gate.
      - linters:
          - gocognit
        path: _test\.go

      # dupl's every current hit is in a table-driven test, where near-identical
      # case blocks are the idiom, not copy-paste to refactor. Excluding test files
      # leaves zero production hits today, so the gate acts as a ratchet against new
      # duplication in non-test code.
      - linters:
          - dupl
        path: _test\.go

      # effectGlyphs is deferred to its own glyph-family pass (see docs/todo-agent.md):
      # it is one wide dispatch over the effect AST, so splitting it wants the glyph
      # grouping decided first. Every other function is held at 30.
      - linters:
          - gocognit
        text: "effectGlyphs"
