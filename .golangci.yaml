# Code generated by project-standards from mklv.config.json. DO NOT EDIT.
#
# This is the project-standards base config with tools.golangci from
# mklv.config.json merged onto it. Edit mklv.config.json instead, then run
# `mage ci:fix`, or `project-standards fix` without Go, to regenerate it.

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - gocognit
    - gocritic
    - revive
    - unconvert
  exclusions:
    rules:
      - linters:
          - gocognit
        path: _test\.go
      - linters:
          - dupl
        path: _test\.go
      - linters:
          - unused
        text: const \w+Unset is unused
      - linters:
          - revive
        text: should be of the form
      - linters:
          - revive
        path: internal/cards/sets/
        text: should have a package comment
      - linters:
          - gocognit
        text: effectGlyphs
      - linters:
          - revive
        path: magefiles/cards\.go
        text: redefinition of the built-in function (new|max)
  settings:
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: ${base-path}/.ruleguard.go
run:
  build-tags:
    - mage
version: "2"
