# Markdown lint config for goldmark-lint (markdownlint-cli2 compatible).
# https://github.com/mrueg/goldmark-lint
#
# Rules use markdownlint IDs; the trailing comment names the quickmark rule this
# was translated from. Only the rules quickmark turned off are listed here — every
# other markdownlint rule stays at its default.
config:
  MD013: false # line-length — let editors handle wrapping
  MD031: false # blanks-around-fences — allow fences without surrounding blanks
  MD032: false # blanks-around-lists — too strict for loose lists with spacing
  MD033: false # no-inline-html — allow inline HTML (badges, GitHub READMEs)
  MD037: false # no-space-in-emphasis — allow spaces inside emphasis markers
  MD040: false # fenced-code-language — don't require a language on fences
  MD041: false # first-line-heading — some docs open with a comment / front matter
  MD049: false # emphasis-style — allow both * and _
  # MD060 (table column style) is a rule quickmark never had. Leave it off: this
  # repo spells "Æmber" throughout, and Æ (U+00C6) is East-Asian *ambiguous*
  # width, so the linter counts it as two columns while editors render it as one.
  # Enforcing visual table alignment would make every Æ-containing table silently
  # fail on a column no editor shows.
  MD060: false
  # no-duplicate-heading — keyforge-master-rulebook.md faithfully reproduces the
  # official rulebook, which repeats step/section names across the rules body, the
  # glossary, and the timing-chart appendix (each under a different parent heading).
  MD024:
    siblings_only: true

# docs/keyforge-master-rulebook.md faithfully reproduces the official KeyForge
# rulebook, so it is not authored to the house lint rules: it repeats headings
# and opens several sections with their own top-level heading on purpose. Turn
# off the heading-uniqueness rules for that one verbatim copy.
overrides:
  - files:
      - "docs/keyforge-master-rulebook.md"
    config:
      MD024: false # no-duplicate-heading
      MD025: false # single-h1

# Walk to the git root and honor .gitignore, matching quickmark's default scope
# (tracked plus untracked files, minus anything .gitignore excludes).
gitignore: true

# docs/todo.md is the human's personal scratch list — freeform, often mid-edit,
# and never kept lint-clean; agents never write into it (see the repo AGENTS.md),
# so holding it to the doc lint standard would only ever fail the gate on the
# human's placeholders.
ignores:
  - "docs/todo.md"
